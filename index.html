size:13px}.choice.picked{background:#f8e0e3;border-color:#dbaab1}.choice.good{background:#edf7f1;border-color:#7bb497}.choice.bad{background:#fae5e5;border-color:#d89999}.hint{background:#fcf0ef;border:1px solid #f2dfdd;padding:18px;border-radius:13px}.field{padding:12px;width:100%;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.watermark{position:fixed;bottom:15px;right:23px;pointer-events:none;text-align:center;opacity:.55;z-index:5}.watermark div{font:italic 52px Georgia,serif;color:#ab7a80}.watermark small{font-size:9px;letter-spacing:5px;color:#9c7a7d}.term{min-height:185px;background:#f8e9e9;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;border:1px solid var(--line);border-radius:15px;padding:25px;cursor:pointer}.muted{color:var(--sub)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}header{gap:12px;padding:0 15px}.brand,.user{display:none}.nav{gap:12px}.nav a{font-size:11px}.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto}.sidebar .side{min-width:105px}.hero{padding:37px 25px}}@media(max-width:500px){.grid,.twocol{grid-template-columns:1fr}.nav{gap:8px}.nav a{font-size:10px}.logo{font-size:30px}.wrap{padding:18px 13px 85px}.card{padding:16px}}

const DB={"units":[["4.1","Technological Innovations","How cross-cultural interactions spread technologies that facilitated maritime trade and travel.",["Magnetic compass","Astrolabe","Lateen sail","Caravel","Cartography"],"Chinese compass knowledge, navigational tools improved by Islamic scholars, lateen sails, and new ships allowed sailors to navigate longer voyages. The caravel combined maneuverability with ocean-going capabilities. Knowledge traveled through older trade networks before the era of European maritime expansion.",["Compass: navigational instrument adopted from China","Astrolabe: helps determine latitude using celestial bodies","Caravel: small Portuguese sailing ship suited to exploration","Lateen sail: triangular sail suited to changing wind directions"],["Compare the contribution of Chinese and Islamic technologies to European voyages.","Explain how technological diffusion from earlier trade networks enabled transoceanic exploration."]],["4.2","Exploration: Causes & Events","Explain the role of states in expanding maritime exploration from 1450 to 1750.",["Gold, God, Glory","Prince Henry","Vasco da Gama","Columbus","State sponsorship"],"European monarchs financed costly expeditions to gain direct access to Asian trade, accumulate wealth, extend political influence, and spread Christianity. Portugal sought routes around Africa; Vasco da Gama reached India by sea in 1498. Spain financed Columbus’s westward voyage in 1492, connecting the Americas to expanding Atlantic networks.",["Gold: seek wealth and trade routes","God: spread Christianity through missionary activity","Glory: state prestige, political influence, and fame","Vasco da Gama: Portuguese voyage to India, 1498"],["Why were European monarchs willing to finance risky overseas voyages?","Compare Portuguese and Spanish approaches to maritime expansion."]],["4.3","The Columbian Exchange","Trace plants, animals, diseases and people moving between hemispheres.",["Smallpox","Maize","Potatoes","Horses","Sugarcane","African diaspora"],"The Columbian Exchange reshaped environments and populations after sustained contact between the Eastern and Western Hemispheres. American crops such as maize and potatoes spread to Afro-Eurasia; horses, cattle, sugarcane and wheat arrived in the Americas. Diseases such as smallpox devastated Indigenous American communities. Plantation economies drove forced migration of enslaved Africans and created enduring cultural exchange and African diasporas.",["Americas → Afro-Eurasia: maize, potatoes, tomatoes","Afro-Eurasia → Americas: horses, cattle, sugarcane, wheat","Disease: smallpox and other epidemics reduced Indigenous populations","Diaspora: forced African migration also spread languages, religions, foods, music"],["Describe two environmental effects of the Columbian Exchange.","Explain how sugar cultivation influenced Atlantic labor migration."]],["4.4","Maritime Empires Established","Explain how European empires connected regions through trade and conquest.",["Trading-post empires","Vasco da Gama","Portuguese Estado da Índia","Treaty of Tordesillas","Dutch and British companies"],"Portugal established fortified trading posts around Africa and the Indian Ocean, using naval power to influence commerce. Spain established extensive territorial colonies in the Americas, including New Spain and Peru. Dutch, British, and French expansion increased rivalry. Some Asian states responded with restrictions on trade, while African states such as Asante and Kongo were reshaped by trade connections.",["Trading post: strategically located coastal commercial foothold","1494 Treaty of Tordesillas: division of overseas claims between Spain and Portugal","Spanish conquests established colonial rule in much of the Americas","Japan restricted many foreign commercial contacts under the Tokugawa shogunate"],["Compare Spanish territorial conquest with Portuguese trading-post strategies.","Explain how local rulers shaped European access to trade."]],["4.5","Maritime Empires Developed","Economic strategies used to consolidate and maintain maritime power.",["Mercantilism","Joint-stock companies","Dutch East India Company","Atlantic slavery","Plantation systems"],"Mercantilist policies sought a favorable balance of trade and state accumulation of precious metals. Colonies supplied raw materials and markets. Joint-stock companies pooled investors' capital to finance risky voyages and secure commercial privileges. Plantation agriculture, especially sugar, helped intensify coerced labor and transatlantic slavery. Global trade expanded but inequality and competition intensified.",["Mercantilism: policies favoring exports, bullion and colonial markets","Joint-stock company: investors purchase shares and share financial risks","Dutch East India Company: chartered commercial company with state-granted privileges","Plantation: large agricultural estate producing cash crops for export"],["Explain how joint-stock companies facilitated empire building.","Analyze the connections among mercantilism, plantations, and slavery."]],["4.6","Challenges to State Power","Internal and external resistance to expanding states.",["Queen Nzinga","Maratha resistance","Pueblo Revolt","Stono Rebellion","Fronde"],"Expansion provoked resistance from colonized peoples, enslaved workers, and local elites. Queen Nzinga resisted Portuguese encroachment in central Africa. The Pueblo Revolt challenged Spanish colonial religious and political control in 1680. The Stono Rebellion challenged slavery in South Carolina in 1739. The Fronde challenged royal authority in seventeenth-century France.",["Queen Nzinga: resistance against Portuguese influence and slave raiding in central Africa","Pueblo Revolt (1680): Indigenous uprising against Spanish rule in New Mexico","Stono Rebellion (1739): revolt by enslaved Africans in South Carolina","Fronde (1648–1653): uprisings against royal authority in France"],["Compare two rebellions using their causes and outcomes.","Explain why economic and cultural changes triggered resistance to state power."]],["4.7","Changing Social Hierarchies","How elites and ordinary people renegotiated status from 1450 to 1750.",["Casta system","Peninsulares","Creoles","Mestizos","Mulattoes","Boyars"],"Colonial societies developed racialized and ancestry-based hierarchies. In Spanish America, peninsulares—Spanish-born elites—generally held top administrative positions, while American-born Spaniards (creoles) and mixed-ancestry groups occupied different categories. Many Indigenous and enslaved African peoples faced exploitation. Elsewhere, rulers attempted to curb aristocratic power, including the Russian boyars.",["Peninsulares: people born on the Iberian Peninsula, often privileged in Spanish colonial administration","Creoles: in this context, people of Spanish descent born in the Americas","Mestizos: people of mixed European and Indigenous American ancestry","Boyars: powerful hereditary Russian nobles"],["Explain how colonial systems organized people by ancestry and status.","Compare colonial social hierarchies with efforts by monarchies to limit noble power."]],["4.8","Continuity & Change, 1450–1750","Synthesize global change over three centuries.",["Indian Ocean trade","Atlantic networks","Religious syncretism","Coerced labor","Commercial expansion"],"Older Indian Ocean and overland trading networks persisted while Atlantic links transformed global exchange. Navigation technologies and maritime empires integrated the Americas into Afro-Eurasian commerce. States continued using taxation, hierarchy and coerced labor, but scale and organization changed. The Columbian Exchange moved crops, diseases, people and cultural traditions across oceans.",["Continuity: established Indian Ocean commerce remained important","Change: sustained Atlantic networks linked the Western and Eastern Hemispheres","Continuity: coerced labor remained in use","Change: enlarged plantation slavery and the global spread of crops"],["Develop a continuity-and-change thesis about global trade from 1450 to 1750.","Identify one continuity and one major change in labor systems."]]],"questions":[[0,"Which innovation spread from China and supported oceanic navigation?",["Magnetic compass","Steam engine","Telegraph","Cotton gin"],0,"Chinese compass technology contributed to more reliable navigation."],[0,"Which ship is closely associated with Portuguese exploration?",["Caravel","Ironclad","Longship","Dreadnought"],0,"The maneuverable caravel enabled voyages along coasts and into the Atlantic."],[0,"The astrolabe was especially useful for determining a ship's ...",["Latitude","Tax revenue","Cargo weight","Draft"],0,"Astronomical observations helped navigators estimate latitude."],[1,"Which set BEST captures common European motivations for maritime exploration?",["Gold, God, and Glory","Democracy, peace, and equality","Industry, oil, and railroads","Isolation and reduced trade"],0,"Wealth, conversion and prestige motivated state-sponsored voyages."],[1,"Which Portuguese navigator reached India by sea in 1498?",["Vasco da Gama","Columbus","Cortés","Magellan"],0,"Da Gama reached India by rounding Africa."],[1,"Spain financed Columbus's first Atlantic voyage in ...",["1492","1607","1750","1453"],0,"The Spanish crown sponsored Columbus in 1492."],[2,"Which crop moved FROM the Americas to Afro-Eurasia?",["Potato","Wheat","Sugarcane","Banana"],0,"Potatoes originated in the Americas."],[2,"What explains much of the dramatic Indigenous population decline after contact?",["Epidemic diseases","Universal migration to Europe","Excess grain production","Improved medicine"],0,"Old World epidemics like smallpox spread among populations without prior exposure."],[2,"Horses and cattle moved primarily ...",["From Afro-Eurasia to the Americas","From the Americas to Europe","From Peru to China only","From Antarctica to Africa"],0,"Europeans introduced horses and cattle to the Americas."],[2,"Sugar plantations in the Americas contributed to ...",["Expansion of enslaved African labor","The ending of coerced labor","A sharp drop in Atlantic shipping","No population movements"],0,"Demand for plantation labor contributed to the Atlantic slave trade."],[3,"Portuguese expansion in the Indian Ocean initially relied heavily on ...",["Fortified trading posts","Conquest of inland China","Mass settlement throughout Japan","Ending maritime trade"],0,"Coastal posts gave Portugal strategic commercial footholds."],[3,"The Treaty of Tordesillas was signed by ...",["Spain and Portugal","England and France","China and Japan","Russia and the Ottomans"],0,"The 1494 treaty divided claimed overseas spheres."],[3,"Which European empire conquered extensive territories in the Americas?",["Spain","The Netherlands only","Russia","Sweden"],0,"Spain established territorial colonies in the Americas."],[4,"Mercantilist policy generally aimed to ...",["Increase exports and acquire bullion","Eliminate colonial raw materials","Allow only foreign ships","End trade controls"],0,"Mercantilist governments encouraged exports and accumulated precious metals."],[4,"Why did joint-stock companies matter?",["They pooled capital and distributed risk","They banned investors","They ended voyages","They replaced every monarchy"],0,"Selling shares allowed investors to fund costly long-distance trade."],[4,"A major Atlantic cash crop cultivated using enslaved labor was ...",["Sugar","Rice exclusively in Siberia","Tea in Mexico","Silk in Peru"],0,"Sugar plantations expanded in Brazil and the Caribbean."],[4,"The Dutch East India Company is an example of a ...",["Joint-stock trading company","Spanish missionary order","Indigenous confederation","Mughal cavalry corps"],0,"The VOC had investors and chartered trading privileges."],[5,"The Pueblo Revolt of 1680 opposed the rule of ...",["Spanish colonists","Dutch merchants in Japan","Ottoman officials","Chinese emperors"],0,"Pueblo communities resisted Spanish rule in New Mexico."],[5,"Queen Nzinga is associated with resistance to ...",["Portuguese encroachment in central Africa","Dutch control of Java","Mughal rule in Delhi","French rule in Haiti"],0,"Nzinga resisted Portuguese influence and raiding."],[5,"The Stono Rebellion occurred in ...",["South Carolina","Brazil","New Spain","Japan"],0,"The 1739 uprising involved enslaved Africans in colonial South Carolina."],[5,"The Fronde challenged royal authority in ...",["France","China","Peru","Ethiopia"],0,"The Fronde involved unrest in France between 1648 and 1653."],[6,"In Spanish colonial society, peninsulares were ...",["Iberian-born elites","Americas-born Spaniards","Mixed Indigenous-European ancestry","Russian noblemen"],0,"Peninsulares were born in the Iberian Peninsula."],[6,"Mestizo commonly referred to someone with ...",["Mixed European and Indigenous ancestry","Only Russian ancestry","Only Chinese ancestry","Only Portuguese birth"],0,"Mestizo categorized mixed European and Indigenous American ancestry."],[6,"Boyars were influential nobles in ...",["Russia","New Spain","Brazil","Ceylon"],0,"Boyars were a hereditary elite in Russia."],[7,"Which was a CONTINUITY in global commerce through 1450–1750?",["Indian Ocean trade persisted","There were no older trading routes","Atlantic commerce ended","All nations became identical"],0,"Indian Ocean exchanges continued amid the new Atlantic networks."],[7,"Which was a major CHANGE after 1450?",["Integration of the Americas into sustained global trade","Complete disappearance of coercive labor","End of religious exchanges","No movement of crops"],0,"Transoceanic connections reshaped the world economy."],[7,"Which statement offers a defensible continuity-and-change claim?",["Existing trade routes persisted while Atlantic exchange expanded","All commerce vanished in 1500","Social hierarchies ceased to exist","European states stopped sponsoring voyages"],0,"Good CCOT analysis names both persistence and transformation."],[3,"Which African states became more influential through trade networks in this period?",["Asante and Kongo","Inca and Aztec","Qing and Tokugawa","Ottoman and Safavid"],0,"The lecture identifies Asante and the Kingdom of Kongo."],[4,"Colonies under mercantilism were often expected to ...",["Supply raw materials and buy metropolitan goods","Trade entirely without restrictions","Use no labor","Produce no exports"],0,"Colonies supplied resources and markets to imperial centers."],[6,"Creoles in the Spanish American hierarchy were generally ...",["People of Spanish descent born in the Americas","People born in Iberia","Indigenous priests exclusively","Dutch shareholders"],0,"The term refers here to American-born Spanish descendants."],[0,"Which sail helped vessels navigate changing winds?",["Lateen sail","Steam sail","Parachute","Iron rudder only"],0,"Triangular lateen sails improved maneuvering."],[1,"A major economic motive for bypassing Mediterranean intermediaries was access to ...",["Asian goods and trade profits","Antarctic fisheries","Modern petroleum","Rail infrastructure"],0,"Direct access to Asian trade promised profit."],[2,"Which is a plausible long-term cultural effect of the Atlantic slave trade?",["Development of African diasporas","Elimination of all languages","No cultural contact","End of food exchange"],0,"Diaspora communities shaped language, music, religion and foods."],[5,"The Stono Rebellion is an example of resistance by ...",["Enslaved people","Spanish monarchs","Tokugawa shoguns","Dutch investors"],0,"Enslaved Africans resisted their conditions in South Carolina."],[7,"Which historical skill asks what remained similar and what changed?",["Continuity and change over time","Only causation","Only sourcing","Only geography"],0,"CCOT arguments identify both persistence and change."]]};const key="aishas-apworld-u4-v1";let store;try{store=JSON.parse(localStorage.getItem(key))}catch{}if(!store||!Array.isArray(store.done))store={done:[],attempts:[],wrong:[],cards:{},tasks:[],last:0};const save=()=>localStorage.setItem(key,JSON.stringify(store));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=document.getElementById('app');let quiz={list:[],at:0,chosen:-1,submitted:false,score:0},tab='Overview',cardFlip=false,cardAt=0;function go(s){location.hash="#/"+s}function pct(){return Math.round(store.done.length/8*100)}function nav(p){document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('selected',p.startsWith(a.dataset.nav)||(p==='lesson'||p==='flash' ? a.dataset.nav==='topics':p==='quiz'&&a.dataset.nav==='practice')))}function main(){let path=decodeURIComponent(location.hash.replace(/^#\/?/,""))||"home";let kind=path.split('/')[0];nav(kind);if(kind==='home'){document.title="AP World Unit 4 | Aisha's Study Lab";$.innerHTML='<section class="hero"><div class="mapdecor">✧</div><div class="headnote"><div class="eyebrow">AP WORLD HISTORY · UNIT 4</div><h1>Study<br><span class="rose">Smarter.</span></h1><p>Transoceanic Interconnections, 1450–1750. Study guides, AP-style practice, short answers and progress tracking — all in one place.</p><button class="button" onclick="go(\'topics\')">Explore Unit 4 →</button></div></section><h2 style="margin-top:28px">Your learning workspace</h2><div class="grid">'+[['Study Guides','Eight detailed topics','topics','◇'],['Practice','MCQs, SAQs & review','practice','▤'],['Progress',pct()+'% lesson completion','progress','↗'],['Planner','Build your study checklist','planner','▣']].map(x=>'<button class="subject" onclick="go(\''+x[2]+'\')"><span class="icon">'+x[3]+'</span><strong>'+x[0]+'</strong><span class="small">'+x[1]+'</span><span class="small">Explore →</span></button>').join('')+'</div><div class="card" style="margin-top:18px"><div class="row"><div><h3>Continue studying</h3><p>'+esc(DB.units[store.last][1])+'</p></div><button class="button" onclick="go(\'lesson/'+store.last+'\')">Continue →</button></div><div class="line"><div class="fill" style="width:'+pct()+'%"></div></div></div>';return}
if(kind==='topics'){$.innerHTML='<div class="row"><div><div class="eyebrow">TRANSOCEANIC INTERCONNECTIONS · 1450–1750</div><h1 style="margin-top:14px">Study <span class="rose">Guides</span></h1><p>Choose a topic to get started.</p></div><input id="filter" class="field" style="max-width:250px" placeholder="Search topics…" oninput="filterTopics(this.value)"></div><div class="grid" id="topicGrid">'+DB.units.map((u,i)=>topicCard(u,i)).join('')+'</div>';return}
if(kind==='lesson'){let i=Number(path.split('/')[1]);if(!DB.units[i]){go('topics');return}store.last=i;save();lesson(i);return}
if(kind==='flash'){let i=Number(path.split('/')[1]);if(!DB.units[i])return go('topics');flash(i);return}

if(kind==='planner'){$.innerHTML='<div class="eyebrow">PLAN YOUR STUDIES</div><h1>Study <span class="rose">Planner</span></h1><form class="card" onsubmit="newTask(event)"><h3>Add a task</h3><input class="field" name="task" placeholder="e.g. Review Topic 4.3 Columbian Exchange" required maxlength="220"><br><br><button class="button">Add Task</button></form><div class="card" style="margin-top:18px">'+(store.tasks.length?store.tasks.map((x,i)=>'<div class="row bullet"><label><input type="checkbox" onchange="toggleTask('+i+')" '+(x.done?'checked':'')+'> '+esc(x.text)+'</label><button class="button alt" onclick="deleteTask('+i+')">Remove</button></div>').join(''):'<p>Your checklist is empty.</p>')+'</div>';return}}
function topicCard(u,i){return '<button class="subject" data-search="'+esc((u[0]+' '+u[1]).toLowerCase())+'" onclick="go(\'lesson/'+i+'\')"><span class="row"><span class="icon">'+['✧','⚓','✿','⌖','◇','⚔','♜','↗'][i]+'</span><span class="micro">TOPIC '+u[0]+'</span></span><strong>'+esc(u[1])+'</strong><span class="small">'+(store.done.includes(i)?'✓ Completed':'Open lesson →')+'</span></button>'}function filterTopics(s){document.querySelectorAll('#topicGrid .subject').forEach(x=>x.style.display=x.dataset.search.includes(s.toLowerCase())?'':'none')}
function lesson(i){let u=DB.units[i];$.innerHTML='<div class="layout"><aside class="sidebar"><button class="side" onclick="go(\'topics\')">← All topics</button>'+DB.units.map((x,j)=>'<button class="side '+(i===j?'active':'')+'" onclick="go(\'lesson/'+j+'\')">'+x[0]+' · '+esc(x[1])+'</button>').join('')+'<button class="side" onclick="go(\'practice\')">Practice Tests</button></aside><section><div class="banner"><div class="eyebrow">TOPIC '+u[0]+'</div><h1 style="font-size:clamp(30px,4vw,46px);margin:12px 0">'+esc(u[1])+'</h1><p>'+esc(u[2])+'</p></div><div class="tabs">'+['Overview','Notes','Key Terms','Examples','Practice','Resources'].map(x=>'<button class="tab '+(tab===x?'active':'')+'" onclick="selectTab('+i+',\''+x+'\')">'+x+'</button>').join('')+'</div><div id="tabcontent"></div><div class="row" style="margin-top:18px"><button class="button alt" onclick="go(\'lesson/'+Math.max(0,i-1)+'\')">← Previous</button><button class="button alt" onclick="go(\'lesson/'+Math.min(7,i+1)+'\')">Next →</button></div></section></div>';fillTab(i)}
function selectTab(i,t){tab=t;lesson(i)}function fillTab(i){let u=DB.units[i];const area=document.getElementById('tabcontent');let out='';if(tab==='Overview')out='<div class="card"><div class="row"><h2>Unit Overview</h2><span class="small">Topic '+u[0]+'</span></div><p>'+esc(u[4])+'</p><h3>Key themes</h3><div class="twocol">'+u[3].map(x=>'<div class="card" style="box-shadow:none;background:#fbf3f1">'+esc(x)+'</div>').join('')+'</div><br><button class="button" onclick="markDone('+i+')">'+(store.done.includes(i)?'✓ Lesson completed':'Mark Lesson Complete')+'</button></div>';if(tab==='Notes')out='<div class="card"><h2>Study Notes</h2><p>'+esc(u[4])+'</p>'+u[5].map(x=>'<div class="bullet">✧ '+esc(x)+'</div>').join('')+'<p class="small" style="margin-top:20px">Adapted from the uploaded Unit 4 lecture and AMSCO course materials; summaries are study notes rather than direct quotations.</p></div>';if(tab==='Key Terms')out='<div class="card"><h2>Key Terms</h2><p>Practice your vocabulary using interactive flashcards.</p><button class="button" onclick="go(\'flash/'+i+'\')">Open Flashcard Deck →</button><div class="twocol" style="margin-top:18px">'+u[3].map(x=>'<div class="card" style="background:#fdf6f3">'+esc(x)+'</div>').join('')+'</div></div>';if(tab==='Examples')out='<div class="card"><h2>AP World Written Practice</h2><p>Answer each prompt in 2–4 specific sentences. Use historical evidence and explain the connection rather than merely naming an event.</p>'+u[6].map((q,k)=>'<div class="bullet"><h3>Prompt '+(k+1)+'</h3><p>'+esc(q)+'</p><textarea class="field" rows="4" id="essay'+k+'" placeholder="Write your response (not saved)…"></textarea><button class="button alt" style="margin-top:10px" onclick="alert(\'Self-check: Include a specific historical example, a defensible explanation, and a clear link to the prompt. This response is not automatically graded.\')">Show self-check rubric</button></div>').join('')+'</div>';if(tab==='Practice')out='<div class="card"><h2>Practice Topic '+u[0]+'</h2><p>Check comprehension with immediate explanations and mastery tracking.</p><button class="button" onclick="startQuiz('+i+')">Start Practice →</button></div>';if(tab==='Resources')out='<div class="card"><h2>Resources</h2><p>This lesson was created using the corresponding uploaded lecture slides and AMSCO reading for this topic. Refer back to your original teacher materials for source passages, maps and slide illustrations.</p><p>Topic '+u[0]+': '+esc(u[1])+'</p></div>';area.innerHTML=out}
function markDone(i){if(!store.done.includes(i))store.done.push(i);save();lesson(i)}
function flash(i){let u=DB.units[i];cardAt=Math.min(cardAt,u[5].length-1);let index=cardAt;let raw=u[5][index].split(':');$.innerHTML='<button class="button alt" onclick="go(\'lesson/'+i+'\')">← Topic '+u[0]+'</button><h1 style="margin-top:25px">Key <span class="rose">Terms</span></h1><p>'+esc(u[1])+' · Card '+(index+1)+' of '+u[5].length+'</p><div class="term" onclick="cardFlip=!cardFlip;flash('+i+')"><div class="eyebrow">'+(cardFlip?'DEFINITION':'TERM')+'</div><h2 style="margin:20px 0">'+esc(cardFlip?(raw.slice(1).join(':')||raw[0]):raw[0])+'</h2><span class="small">Tap to flip</span></div><div class="row" style="margin-top:20px"><button class="button alt" onclick="cardAt=Math.max(0,cardAt-1);cardFlip=false;flash('+i+')">← Previous</button><button class="button" onclick="masterCard('+i+','+index+')">'+(store.cards[i+'-'+index]?'✓ Mastered':'Mark Mastered')+'</button><button class="button alt" onclick="cardAt=Math.min('+ (u[5].length-1)+',cardAt+1);cardFlip=false;flash('+i+')">Next →</button></div>'}function masterCard(i,j){store.cards[i+'-'+j]=!store.cards[i+'-'+j];save();flash(i)}
function startQuiz(topic){quiz={list:DB.questions.map((x,i)=>i).filter(i=>topic<0||DB.questions[i][0]===topic),at:0,chosen:-1,submitted:false,score:0};go('quiz')}function startWrong(){if(!store.wrong.length)return alert('You have no missed questions to review yet.');quiz={list:[...store.wrong],at:0,chosen:-1,submitted:false,score:0};go('quiz')}function quizPage(){if(quiz.at>=quiz.list.length)return quizEnd();let q=DB.questions[quiz.list[quiz.at]];$.innerHTML='<div class="layout"><aside class="sidebar"><button class="side" onclick="go(\'practice\')">← Back to Practice</button><button class="side active">Multiple Choice</button><button class="side" onclick="go(\'lesson/'+q[0]+'\')">Review Topic '+DB.units[q[0]][0]+'</button></aside><section><div class="row"><span class="small">Question '+(quiz.at+1)+' of '+quiz.list.length+'</span><span class="small">'+Math.round(quiz.at/quiz.list.length*100)+'%</span></div><div class="line" style="margin:12px 0 19px"><div class="fill" style="width:'+Math.round(quiz.at/quiz.list.length*100)+'%"></div></div><div class="card"><div class="eyebrow">UNIT 4 PRACTICE</div><h2 style="margin:20px 0">'+esc(q[1])+'</h2>'+q[2].map((o,i)=>'<button class="choice '+(quiz.chosen===i?'picked ':'')+(quiz.submitted?(i===q[3]?'good':quiz.chosen===i?'bad':''):'')+'" onclick="choose('+i+')" '+(quiz.submitted?'disabled':'')+'>'+'ABCD'[i]+'. &nbsp; '+esc(o)+'</button>').join('')+(quiz.submitted?'<div class="hint"><h3>'+(quiz.chosen===q[3]?'Correct!':'Review the answer')+'</h3><p>'+esc(q[4])+'</p></div>':'')+'<div class="row" style="margin-top:21px"><span class="small">Topic '+DB.units[q[0]][0]+'</span><button class="button" onclick="'+(quiz.submitted?'next()':'submit()')+'" '+(!quiz.submitted&&quiz.chosen<0?'disabled':'')+'>'+(quiz.submitted?'Next Question →':'Submit Answer')+'</button></div></div><div class="hint" style="margin-top:16px">✧ &nbsp; <strong>Quick Tip</strong><p>Before selecting, identify the time period and the specific historical development being tested.</p></div></section></div>'}function choose(i){if(quiz.submitted)return;quiz.chosen=i;quizPage()}function submit(){if(quiz.chosen<0)return;quiz.submitted=true;let id=quiz.list[quiz.at];if(quiz.chosen===DB.questions[id][3]){quiz.score++;store.wrong=store.wrong.filter(x=>x!==id)}else if(!store.wrong.includes(id))store.wrong.push(id);save();quizPage()}function next(){quiz.at++;quiz.chosen=-1;quiz.submitted=false;if(quiz.at>=quiz.list.length)quizEnd();else quizPage()}function quizEnd(){store.attempts.push({when:new Date().toLocaleDateString(),score:quiz.score,total:quiz.list.length});save();$.innerHTML='<div class="hero"><div class="eyebrow">PRACTICE COMPLETE</div><h1>Your <span class="rose">Results</span></h1><h2>'+quiz.score+' / '+quiz.list.length+' correct</h2><p>Review missed questions to improve your understanding of Unit 4.</p><button class="button" onclick="go(\'progress\')">View Progress</button> <button class="button alt" onclick="startWrong()">Review Mistakes</button></div>'}
function newTask(e){e.preventDefault();let x=e.target.task.value.trim();if(x)store.tasks.push({text:x,done:false});save();main()}function toggleTask(i){store.tasks[i].done=!store.tasks[i].done;save()}function deleteTask(i){store.tasks.splice(i,1);save();main()}function exportProgress(){let blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='aisha-apworld-unit4-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importProgress(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let z=JSON.parse(rd.result);if(!Array.isArray(z.done)||!Array.isArray(z.attempts)||!Array.isArray(z.wrong)||!Array.isArray(z.tasks))throw Error();store=z;save();main()}catch{alert('Not a valid progress backup.')}};rd.readAsText(f)}
window.addEventListener('hashchange',()=>{tab='Overview';cardFlip=false;cardAt=0;main()});main();
</script></body></html>
